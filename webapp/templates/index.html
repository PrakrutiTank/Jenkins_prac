<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Flower Classification - MLOps</title>
    <style>
        :root {
            --primary: #4361ee;
            --primary-hover: #3a0ca3;
            --secondary: #4cc9f0;
            --bg-color: #f8f9fc;
            --card-bg: #ffffff;
            --text-dark: #2b2d42;
            --text-muted: #6c757d;
            --success: #2ec4b6;
            --danger: #e63946;
            --border-radius: 12px;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 35px 40px;
            margin-bottom: 25px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4a4e69;
        }

        .form-group input {
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            padding: 13px 20px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s;
            flex: 1;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: #e9ecef;
            color: var(--text-dark);
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #edf6f9;
            border-left: 5px solid var(--primary);
            text-align: center;
        }

        .result-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .prediction-badge {
            display: inline-block;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: capitalize;
            margin-bottom: 8px;
        }

        .db-badge {
            font-size: 0.82rem;
            color: #2b7a78;
            background: #d8f3dc;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            font-weight: 500;
        }

        .alert-error {
            background: #ffe3e3;
            color: var(--danger);
            border-left: 4px solid var(--danger);
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .sample-chips {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .chip {
            background: #f1f3f5;
            padding: 4px 10px;
            border-radius: 14px;
            cursor: pointer;
            border: 1px solid #dee2e6;
            transition: all 0.2s;
        }

        .chip:hover {
            background: #e2e6ea;
            border-color: #ced4da;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Iris Flower Classifier</h1>
                <p>Enter flower measurements in cm to predict the Iris species</p>
            </div>

            {% if error %}
            <div class="alert-error">
                <strong>Error:</strong> {{ error }}
            </div>
            {% endif %}

            <form action="/predict" method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="sepal_length">Sepal Length (cm)</label>
                        <input type="number" step="0.1" min="0" max="15" id="sepal_length" name="sepal_length"
                               value="{{ inputs.sepal_length if inputs else '5.1' }}" required>
                    </div>
                    <div class="form-group">
                        <label for="sepal_width">Sepal Width (cm)</label>
                        <input type="number" step="0.1" min="0" max="15" id="sepal_width" name="sepal_width"
                               value="{{ inputs.sepal_width if inputs else '3.5' }}" required>
                    </div>
                    <div class="form-group">
                        <label for="petal_length">Petal Length (cm)</label>
                        <input type="number" step="0.1" min="0" max="15" id="petal_length" name="petal_length"
                               value="{{ inputs.petal_length if inputs else '1.4' }}" required>
                    </div>
                    <div class="form-group">
                        <label for="petal_width">Petal Width (cm)</label>
                        <input type="number" step="0.1" min="0" max="15" id="petal_width" name="petal_width"
                               value="{{ inputs.petal_width if inputs else '0.2' }}" required>
                    </div>
                </div>

                <div class="sample-chips">
                    <span>Quick presets:</span>
                    <span class="chip" onclick="fillInputs(5.1, 3.5, 1.4, 0.2)">Setosa</span>
                    <span class="chip" onclick="fillInputs(5.9, 3.0, 4.2, 1.5)">Versicolor</span>
                    <span class="chip" onclick="fillInputs(6.5, 3.0, 5.5, 1.8)">Virginica</span>
                </div>

                <div class="button-group" style="margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">Predict Species</button>
                    <a href="/records" class="btn btn-secondary">View Saved Records</a>
                </div>
            </form>

            {% if prediction %}
            <div class="result-box">
                <div class="result-title">Predicted Iris Class</div>
                <div class="prediction-badge">Iris-{{ prediction }}</div>
                <div>
                    <span class="db-badge">{{ db_status }}</span>
                </div>
            </div>
            {% endif %}
        </div>
    </div>

    <script>
        function fillInputs(sl, sw, pl, pw) {
            document.getElementById('sepal_length').value = sl;
            document.getElementById('sepal_width').value = sw;
            document.getElementById('petal_length').value = pl;
            document.getElementById('petal_width').value = pw;
        }
    </script>
</body>
</html>
